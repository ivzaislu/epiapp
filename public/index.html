<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#315bd6">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Отметка утреннего и вечернего приёма. Родитель видит статус, отметить может только ребёнок.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css?v=32">
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <title>EpiApp</title>
</head>
<body>
  <div class="wrap">
    <section id="gate" class="page">
      <div class="identity">
        <svg class="emblem" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="120" fill="currentColor"/><path d="M151 263l70 70 143-158" fill="none" stroke="#fff" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div>
          <p class="kicker">EpiApp</p>
          <h1>Кабинет</h1>
          <p class="sub" id="gateMessage">Проверяю Telegram-аккаунт…</p>
        </div>
      </div>
    </section>

    <section id="app" hidden>
      <header class="page top">
        <div class="identity">
          <svg class="emblem" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="120" fill="currentColor"/><path d="M151 263l70 70 143-158" fill="none" stroke="#fff" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <div>
            <p class="kicker" id="kicker"></p>
            <h1 id="title"></h1>
            <p class="sub" id="sub"></p>
          </div>
        </div>
        <button id="gear" type="button" aria-label="Настройки">
          <svg class="icon-gear" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.2 7.2 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.22-1.14.54-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.31.6.22l2.39-.96c.49.4 1.04.72 1.63.94l.36 2.54c.05.24.26.42.5.42h3.84c.24 0 .45-.18.5-.42l.36-2.54c.59-.22 1.14-.54 1.63-.94l2.39.96c.22.09.47 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></svg>
          <svg class="icon-back" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M15.7 5.3a1 1 0 0 1 0 1.4L10.4 12l5.3 5.3a1 1 0 0 1-1.4 1.4l-6-6a1 1 0 0 1 0-1.4l6-6a1 1 0 0 1 1.4 0z"/></svg>
        </button>
      </header>
      <div class="page">
        <div id="screen"></div>
      </div>
    </section>
  </div>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <h2 id="sheetTitle"></h2>
      <p id="sheetText"></p>
      <button id="sheetYes" class="primary" type="button">Да, отметить</button>
      <button id="sheetNo" class="quiet" type="button">Нет, ещё нет</button>
    </div>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="/app.js?v=32"></script>
</body>
</html>
