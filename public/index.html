<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#315bd6">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Отметка утреннего и вечернего приёма. Родитель видит статус, отметить может только ребёнок.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css?v=24">
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <title>EpiApp</title>
</head>
<body>
  <div class="wrap">
    <section id="gate" class="page">
      <div class="identity">
        <svg class="emblem" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="120" fill="currentColor"/><path d="M151 263l70 70 143-158" fill="none" stroke="#fff" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div>
          <p class="kicker">EpiApp</p>
          <h1>Кабинет</h1>
          <p class="sub" id="gateMessage">Проверяю Telegram-аккаунт…</p>
        </div>
      </div>
    </section>

    <section id="app" hidden>
      <button id="back" type="button" hidden>← Назад</button>
      <header class="page top">
        <div class="identity">
          <svg class="emblem" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="120" fill="currentColor"/><path d="M151 263l70 70 143-158" fill="none" stroke="#fff" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <div>
            <p class="kicker" id="kicker"></p>
            <h1 id="title"></h1>
            <p class="sub" id="sub"></p>
          </div>
        </div>
      </header>
      <div class="page">
        <div id="screen"></div>
      </div>
    </section>
  </div>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <h2 id="sheetTitle"></h2>
      <p id="sheetText"></p>
      <button id="sheetYes" class="primary" type="button">Да, отметить</button>
      <button id="sheetNo" class="quiet" type="button">Нет, ещё нет</button>
    </div>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="/app.js?v=24"></script>
</body>
</html>
