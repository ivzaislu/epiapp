name: CI

on:
  push:
    branches:
      - v1
      - v-1.1
      - epiappapk
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18.19.1, 20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Unit tests
        run: npm test

      - name: JavaScript syntax checks
        run: npm run check

      - name: Installer and signing script syntax checks
        run: |
          bash -n install.sh
          bash -n scripts/create-android-release-key.sh

  selfhost:
    name: Self-host Docker stack
    if: github.ref_name == 'epiappapk' || github.ref_name == 'main' || github.head_ref == 'epiappapk' || github.base_ref == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Docker doctor command
        env:
          TELEGRAM_BOT_TOKEN: 123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZ_123456
          TELEGRAM_ADMIN_ID: '123456789'
          APP_BASE_URL: https://epiapp.example.com
          APP_DOMAIN: epiapp.example.com
          HOST: 127.0.0.1
          PORT: '3000'
          DATA_FILE: /tmp/epiapp.json
        run: npm run doctor:docker:offline

      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config >/dev/null

      - name: Build production Docker image
        run: docker build -t epiapp-ci .

      - name: Smoke-test Docker healthcheck
        run: |
          docker run -d --name epiapp-ci-run epiapp-ci
          for attempt in $(seq 1 30); do
            if docker exec epiapp-ci-run node -e "fetch('http://127.0.0.1:3000/healthz').then(r=>r.json()).then(v=>process.exit(v.ok===true?0:1)).catch(()=>process.exit(1))"; then
              exit 0
            fi
            sleep 1
          done
          docker logs epiapp-ci-run
          exit 1

      - name: Cleanup Docker smoke test
        if: always()
        run: docker rm -f epiapp-ci-run >/dev/null 2>&1 || true

  android:
    name: Android APKs
    if: github.ref_name == 'epiappapk' || github.ref_name == 'main' || github.head_ref == 'epiappapk' || github.base_ref == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" && -n "${ANDROID_HOME:-}" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          test -n "$SDKMANAGER" || { echo "::error::sdkmanager not found on GitHub runner"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon :androidApp:assembleDebug

      - name: Generate ephemeral CI signing key
        run: bash scripts/create-android-release-key.sh

      - name: Build signed release APK with ephemeral key
        run: gradle --no-daemon :androidApp:assembleRelease

      - name: Verify signed release APK
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n1)"
          test -x "$APKSIGNER" || { echo "::error::apksigner not found"; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs androidApp/build/outputs/apk/release/androidApp-release.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: epiapp-debug-apk
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk
          if-no-files-found: error


  android-release:
    name: Signed Android release APK
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'epiappapk'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" && -n "${ANDROID_HOME:-}" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          test -n "$SDKMANAGER" || { echo "::error::sdkmanager not found on GitHub runner"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing key from repository secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::ANDROID_KEYSTORE_BASE64 is not configured"; exit 1; }
          test -n "$ANDROID_STORE_PASSWORD" || { echo "::error::ANDROID_STORE_PASSWORD is not configured"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "::error::ANDROID_KEY_ALIAS is not configured"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "::error::ANDROID_KEY_PASSWORD is not configured"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/epiapp-release.keystore"
          chmod 600 "$RUNNER_TEMP/epiapp-release.keystore"
          keytool -list \
            -keystore "$RUNNER_TEMP/epiapp-release.keystore" \
            -storepass "$ANDROID_STORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Read Android version
        id: version
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' androidApp/build.gradle.kts | head -n1)"
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' androidApp/build.gradle.kts | head -n1)"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        env:
          EPIAPP_KEYSTORE_FILE: ${{ runner.temp }}/epiapp-release.keystore
          EPIAPP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          EPIAPP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          EPIAPP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :androidApp:assembleRelease

      - name: Verify release signature
        run: |
          set -euo pipefail
          APK="androidApp/build/outputs/apk/release/androidApp-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n1)"
          test -x "$APKSIGNER" || { echo "::error::apksigner not found"; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          mkdir -p dist
          cp "$APK" "dist/EpiApp-${{ steps.version.outputs.name }}-release.apk"
          sha256sum "dist/EpiApp-${{ steps.version.outputs.name }}-release.apk" | tee dist/SHA256SUMS.txt

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: EpiApp-${{ steps.version.outputs.name }}-release
          path: |
            dist/EpiApp-${{ steps.version.outputs.name }}-release.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
