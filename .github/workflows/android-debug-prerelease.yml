name: Android debug prerelease

on:
  push:
    branches: [web-next]
    paths:
      - android/app/build.gradle.kts
      - .github/workflows/android-debug-prerelease.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-prerelease
  cancel-in-progress: false

jobs:
  prerelease:
    if: github.ref == 'refs/heads/web-next'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;34.0.0' 'platform-tools'

      - name: Build debug APK
        run: gradle --no-daemon -p android :app:assembleDebug

      - name: Verify and package APK
        run: |
          set -euo pipefail
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v${version}-debug"
          mkdir -p dist
          apk="EpiApp-${version}-debug.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/$apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "dist/$apk" > dist/SIGNING_CERT.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "dist/$apk" | sed -n '1p'
          (cd dist && sha256sum "$apk" > SHA256SUMS.txt)
          echo "DEBUG_TAG=$tag" >> "$GITHUB_ENV"
          echo "DEBUG_VERSION=$version" >> "$GITHUB_ENV"

      - name: Publish debug prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          Тестовая Android-сборка EpiApp ${DEBUG_VERSION} из ветки web-next.

          Коммит ${GITHUB_SHA}.

          Исправлены текст Telegram-уведомления и полноэкранный показ обычного напоминания «Нет отметки».

          APK подписан тестовым ключом GitHub Actions. При несовпадении подписи с установленным APK потребуется переустановка и повторное подключение через Telegram. Ключ debug-сборки может меняться между запусками CI.

          Контрольная сумма находится в SHA256SUMS.txt, сертификат — в SIGNING_CERT.txt.
          EOF
          if gh api "repos/$GH_REPO/releases/tags/$DEBUG_TAG" > existing.json 2>/dev/null; then
            jq -e --arg commit "$GITHUB_SHA" '.draft == true and .target_commitish == $commit' existing.json >/dev/null
            gh release upload "$DEBUG_TAG" dist/* --clobber
          else
            gh release create "$DEBUG_TAG" dist/* --target "$GITHUB_SHA" --draft --prerelease --latest=false --title "EpiApp ${DEBUG_VERSION} debug" --notes-file notes.md
          fi
          gh release edit "$DEBUG_TAG" --draft=false --prerelease --latest=false
