name: Android debug prerelease

on:
  push:
    branches: [web-next]
    paths:
      - android/app/build.gradle.kts
      - .github/workflows/android-debug-prerelease.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-prerelease
  cancel-in-progress: false

jobs:
  prerelease:
    if: github.ref == 'refs/heads/web-next'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;34.0.0' 'platform-tools'

      - name: Test without live Firebase
        run: gradle --no-daemon --max-workers=2 -p android :app:testDebugUnitTest

      - name: Configure Firebase for the distributable APK
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          python3 - <<'PYCONFIG'
          import json, os
          config = os.environ.get('GOOGLE_SERVICES_JSON', '')
          configured = bool(config.strip())
          if configured:
              parsed = json.loads(config)
              assert any(c.get('client_info', {}).get('android_client_info', {}).get('package_name') == 'org.epiapp.android' for c in parsed.get('client', [])), 'Firebase Android package must be org.epiapp.android'
              with open('android/app/google-services.json', 'w') as f: json.dump(parsed, f)
          with open(os.environ['GITHUB_ENV'], 'a') as f: f.write('FIREBASE_CONFIGURED=' + str(configured).lower() + '\n')
          PYCONFIG

      - name: Build debug APK
        run: gradle --no-daemon --max-workers=2 -p android :app:assembleDebug

      - name: Verify and package APK
        run: |
          set -euo pipefail
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v${version}-debug"
          mkdir -p dist
          apk="EpiApp-${version}-debug.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/$apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "dist/$apk" > dist/SIGNING_CERT.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "dist/$apk" | sed -n '1p'
          (cd dist && sha256sum "$apk" > SHA256SUMS.txt)
          echo "DEBUG_TAG=$tag" >> "$GITHUB_ENV"
          echo "DEBUG_VERSION=$version" >> "$GITHUB_ENV"

      - name: Publish debug prerelease
        if: env.FIREBASE_CONFIGURED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          Тестовая Android-сборка EpiApp ${DEBUG_VERSION} из ветки web-next.

          Коммит ${GITHUB_SHA}.

          Добавлена FCM push-доставка родительских уведомлений без открытия кабинета. Для работы серверу нужна конфигурация того же Firebase-проекта. Исправлена потеря сообщений при отключённых разрешениях Android. Резервная фоновая проверка выполняется примерно раз в 15 минут, Android может задерживать проверку.

          APK подписан тестовым ключом GitHub Actions. При несовпадении подписи с установленным APK потребуется переустановка и повторное подключение через Telegram. Ключ debug-сборки может меняться между запусками CI.

          Контрольная сумма находится в SHA256SUMS.txt, сертификат — в SIGNING_CERT.txt.
          EOF
          if gh api "repos/$GH_REPO/releases/tags/$DEBUG_TAG" > existing.json 2>/dev/null; then
            jq -e --arg commit "$GITHUB_SHA" '.draft == true and .target_commitish == $commit' existing.json >/dev/null
            gh release upload "$DEBUG_TAG" dist/* --clobber
          else
            gh release create "$DEBUG_TAG" dist/* --target "$GITHUB_SHA" --draft --prerelease --latest=false --title "EpiApp ${DEBUG_VERSION} debug" --notes-file notes.md
          fi
          gh release edit "$DEBUG_TAG" --draft=false --prerelease --latest=false

      - name: Explain missing Firebase config
        if: env.FIREBASE_CONFIGURED != 'true'
        run: echo '::notice::Build and tests completed. Publication is skipped until ANDROID_GOOGLE_SERVICES_JSON is configured. A polling-only APK is not published as the push update.'
