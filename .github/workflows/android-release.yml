name: Android Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Signed Android release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" && -n "${ANDROID_HOME:-}" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          test -n "$SDKMANAGER" || { echo "::error::sdkmanager not found on GitHub runner"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing key from repository secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::ANDROID_KEYSTORE_BASE64 is not configured"; exit 1; }
          test -n "$ANDROID_STORE_PASSWORD" || { echo "::error::ANDROID_STORE_PASSWORD is not configured"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "::error::ANDROID_KEY_ALIAS is not configured"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "::error::ANDROID_KEY_PASSWORD is not configured"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/epiapp-release.p12"
          chmod 600 "$RUNNER_TEMP/epiapp-release.p12"
          keytool -list             -keystore "$RUNNER_TEMP/epiapp-release.p12"             -storepass "$ANDROID_STORE_PASSWORD"             -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Read Android version
        id: version
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' androidApp/build.gradle.kts | head -n1)"
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' androidApp/build.gradle.kts | head -n1)"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        env:
          EPIAPP_KEYSTORE_FILE: ${{ runner.temp }}/epiapp-release.p12
          EPIAPP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          EPIAPP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          EPIAPP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :androidApp:assembleRelease

      - name: Verify release signature
        run: |
          set -euo pipefail
          APK="androidApp/build/outputs/apk/release/androidApp-release.apk"
          apksigner verify --verbose --print-certs "$APK"
          mkdir -p dist
          cp "$APK" "dist/EpiApp-${{ steps.version.outputs.name }}-release.apk"
          sha256sum "dist/EpiApp-${{ steps.version.outputs.name }}-release.apk" | tee dist/SHA256SUMS.txt

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: EpiApp-${{ steps.version.outputs.name }}-release
          path: |
            dist/EpiApp-${{ steps.version.outputs.name }}-release.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
